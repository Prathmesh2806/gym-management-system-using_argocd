name: 0. Unified Application Deployment
on:
  repository_dispatch:
    types: [deploy-gym-application]
  workflow_dispatch:
    inputs:
      env:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options: [dev, qa, prod, dr]
      deploy_db:
        description: 'Deploy Database?'
        type: boolean
        default: true
      deploy_booking:
        description: 'Deploy Booking Service?'
        type: boolean
        default: true
      deploy_membership:
        description: 'Deploy Membership Service?'
        type: boolean
        default: true
      deploy_notifier:
        description: 'Deploy Notifier Service?'
        type: boolean
        default: true
      deploy_frontend:
        description: 'Deploy Frontend?'
        type: boolean
        default: true
      db_tag:
        description: 'DB Image Tag (Leave empty to build fresh)'
        type: string
        default: ''
      booking_tag:
        description: 'Booking Image Tag (Leave empty to build fresh)'
        type: string
        default: ''
      membership_tag:
        description: 'Membership Image Tag (Leave empty to build fresh)'
        type: string
        default: ''
      notifier_tag:
        description: 'Notifier Image Tag (Leave empty to build fresh)'
        type: string
        default: ''
      frontend_tag:
        description: 'Frontend Image Tag (Leave empty to build fresh)'
        type: string
        default: ''

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Environment
        run: |
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            echo "DEPLOY_ENV=${{ github.event.client_payload.env }}" >> $GITHUB_ENV
            echo "DB_PROMOTE=${{ github.event.client_payload.db_tag }}" >> $GITHUB_ENV
            echo "BOOKING_PROMOTE=${{ github.event.client_payload.booking_tag }}" >> $GITHUB_ENV
            echo "MEMBERSHIP_PROMOTE=${{ github.event.client_payload.membership_tag }}" >> $GITHUB_ENV
            echo "NOTIFIER_PROMOTE=${{ github.event.client_payload.notifier_tag }}" >> $GITHUB_ENV
            echo "FRONTEND_PROMOTE=${{ github.event.client_payload.frontend_tag }}" >> $GITHUB_ENV
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "DEPLOY_ENV=${{ github.event.inputs.env }}" >> $GITHUB_ENV
            echo "DB_PROMOTE=${{ github.event.inputs.db_tag }}" >> $GITHUB_ENV
            echo "BOOKING_PROMOTE=${{ github.event.inputs.booking_tag }}" >> $GITHUB_ENV
            echo "MEMBERSHIP_PROMOTE=${{ github.event.inputs.membership_tag }}" >> $GITHUB_ENV
            echo "NOTIFIER_PROMOTE=${{ github.event.inputs.notifier_tag }}" >> $GITHUB_ENV
            echo "FRONTEND_PROMOTE=${{ github.event.inputs.frontend_tag }}" >> $GITHUB_ENV
          else
            echo "DEPLOY_ENV=dev" >> $GITHUB_ENV
          fi

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set Context Variables
        run: |
          # The Resource Group and Cluster are now shared across all environments
          echo "RG_NAME=gym-app-shared-rg" >> $GITHUB_ENV
          echo "CLUSTER_NAME=gym-shared-aks" >> $GITHUB_ENV
          
          # Fetch the dynamic ACR name using Azure CLI (more reliable than hardcoding)
          ACR_NAME_ACTUAL=$(az acr list --resource-group gym-app-shared-rg --query "[?contains(name, 'gymappregistryshared')].name" -o tsv | head -n 1)
          if [ -z "$ACR_NAME_ACTUAL" ]; then
             echo "ACR_NAME=gymappregshared" >> $GITHUB_ENV # Fallback
          else
             echo "ACR_NAME=$ACR_NAME_ACTUAL" >> $GITHUB_ENV
          fi
          
          # For promotions, if needed, we can still reference a source ACR
          echo "DEV_ACR_NAME=gymappregshared" >> $GITHUB_ENV

      - name: Azure ACR and AKS Login
        run: |
          echo "Logging into ACR: ${{ env.ACR_NAME }}..."
          az acr login --name ${{ env.ACR_NAME }}
          az aks get-credentials --resource-group ${{ env.RG_NAME }} --name ${{ env.CLUSTER_NAME }} --overwrite-existing

      - name: Prepare Database Image
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
        run: |
          SERVICE="db"
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-8)
          BUILD_REQUIRED=false
          
          if [ "${{ github.event_name }}" == "push" ]; then
            if git diff --name-only HEAD^ HEAD | grep -q "src/$SERVICE"; then BUILD_REQUIRED=true; fi
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -z "${{ env.DB_PROMOTE }}" ]; then
             # Force build on manual run if no promote tag provided
             BUILD_REQUIRED=true
          elif [ -z "${{ env.DB_PROMOTE }}" ]; then
             if git diff --name-only HEAD^ HEAD | grep -q "src/$SERVICE"; then BUILD_REQUIRED=true; fi
          fi

          FINAL_TAG=""
          if [ -n "${{ env.DB_PROMOTE }}" ]; then
            FINAL_TAG=${{ env.DB_PROMOTE }}
          elif [ "$BUILD_REQUIRED" == "true" ]; then
            FINAL_TAG="$SERVICE-${{ env.DEPLOY_ENV }}-$SHORT_SHA"
            docker build -t ${{ env.ACR_NAME }}.azurecr.io/gym-$SERVICE:$FINAL_TAG ./src/$SERVICE
            docker push ${{ env.ACR_NAME }}.azurecr.io/gym-$SERVICE:$FINAL_TAG
          else
            FINAL_TAG=$(az acr repository show-tags --name ${{ env.ACR_NAME }} --repository gym-$SERVICE --orderby time_desc --output tsv --query "[0]" 2>/dev/null || echo "latest")
          fi
          echo "DB_TAG=$FINAL_TAG" >> $GITHUB_ENV

      # --- Backend Services Loop (Build/Promote Only) ---
      - name: Prepare Backend Images
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-8)
          SERVICES=("booking" "membership" "notifier")
          
          for SERVICE in "${SERVICES[@]}"; do
            PROMOTE_VAR=$(echo "${SERVICE}_PROMOTE" | tr '[:lower:]' '[:upper:]')
            PROMOTE_TAG=${!PROMOTE_VAR}
            
            SHOULD_RUN=false
            if [ "${{ github.event_name }}" == "push" ]; then SHOULD_RUN=true;
            elif [ "${{ github.event_name }}" == "repository_dispatch" ]; then SHOULD_RUN=true;
            elif [ "${{ github.event.inputs.env }}" != "" ]; then SHOULD_RUN=true; # manual run
            fi

            if [ "$SHOULD_RUN" == "true" ]; then
              BUILD_REQUIRED=false
              if [ "${{ github.event_name }}" == "push" ]; then
                if git diff --name-only HEAD^ HEAD | grep -q "src/$SERVICE"; then BUILD_REQUIRED=true; fi
              elif [ -z "$PROMOTE_TAG" ]; then
                # On manual run, if no promote tag, we force a build for safety
                BUILD_REQUIRED=true
              fi

              FINAL_TAG=""
              if [ -n "$PROMOTE_TAG" ]; then
                FINAL_TAG=$PROMOTE_TAG
              elif [ "$BUILD_REQUIRED" == "true" ]; then
                FINAL_TAG="$SERVICE-${{ env.DEPLOY_ENV }}-$SHORT_SHA"
                docker build -t ${{ env.ACR_NAME }}.azurecr.io/gym-$SERVICE:$FINAL_TAG ./src/$SERVICE
                docker push ${{ env.ACR_NAME }}.azurecr.io/gym-$SERVICE:$FINAL_TAG
              else
                FINAL_TAG=$(az acr repository show-tags --name ${{ env.ACR_NAME }} --repository gym-$SERVICE --orderby time_desc --output tsv --query "[0]" 2>/dev/null || echo "latest")
              fi
              
              ENV_VAR_NAME=$(echo "${SERVICE}_TAG" | tr '[:lower:]' '[:upper:]')
              echo "$ENV_VAR_NAME=$FINAL_TAG" >> $GITHUB_ENV
            fi
          done

      - name: Prepare Frontend Image
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
        run: |
          SERVICE="frontend"
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-8)
          BUILD_REQUIRED=false
          
          if [ "${{ github.event_name }}" == "push" ]; then
            if git diff --name-only HEAD^ HEAD | grep -q "src/$SERVICE"; then BUILD_REQUIRED=true; fi
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -z "${{ env.FRONTEND_PROMOTE }}" ]; then
            # Force build on manual run if no promote tag provided
            BUILD_REQUIRED=true
          elif [ -z "${{ env.FRONTEND_PROMOTE }}" ]; then
            if git diff --name-only HEAD^ HEAD | grep -q "src/$SERVICE"; then BUILD_REQUIRED=true; fi
          fi

          FINAL_TAG=""
          if [ -n "${{ env.FRONTEND_PROMOTE }}" ]; then
            FINAL_TAG=${{ env.FRONTEND_PROMOTE }}
          elif [ "$BUILD_REQUIRED" == "true" ]; then
            FINAL_TAG="$SERVICE-${{ env.DEPLOY_ENV }}-$SHORT_SHA"
            docker build -t ${{ env.ACR_NAME }}.azurecr.io/gym-$SERVICE:$FINAL_TAG ./src/$SERVICE
            docker push ${{ env.ACR_NAME }}.azurecr.io/gym-$SERVICE:$FINAL_TAG
          else
            FINAL_TAG=$(az acr repository show-tags --name ${{ env.ACR_NAME }} --repository gym-$SERVICE --orderby time_desc --output tsv --query "[0]" 2>/dev/null || echo "latest")
          fi
          echo "FRONTEND_TAG=$FINAL_TAG" >> $GITHUB_ENV

      # --- Unified Helm Deployment ---
      - name: Deploy with Helm
        run: |
          # Use defaults from GITHUB_ENV if not specifically set in this run
          DB_TAG=${{ env.DB_TAG || 'latest' }}
          BOOKING_TAG=${{ env.BOOKING_TAG || 'latest' }}
          MEMBERSHIP_TAG=${{ env.MEMBERSHIP_TAG || 'latest' }}
          NOTIFIER_TAG=${{ env.NOTIFIER_TAG || 'latest' }}
          FRONTEND_TAG=${{ env.FRONTEND_TAG || 'latest' }}
          
          # Deploying with Helm
          helm upgrade --install gym-app ./helm/gym-app \
            --namespace ${{ env.DEPLOY_ENV }} \
            --create-namespace \
            -f ./helm/gym-app/values-${{ env.DEPLOY_ENV }}.yaml \
            --set acr.name=${{ env.ACR_NAME }} \
            --set db.enabled=${{ github.event.inputs.deploy_db || 'true' }} \
            --set db.tag=$DB_TAG \
            --set booking.enabled=${{ github.event.inputs.deploy_booking || 'true' }} \
            --set booking.tag=$BOOKING_TAG \
            --set membership.enabled=${{ github.event.inputs.deploy_membership || 'true' }} \
            --set membership.tag=$MEMBERSHIP_TAG \
            --set notifier.enabled=${{ github.event.inputs.deploy_notifier || 'true' }} \
            --set notifier.tag=$NOTIFIER_TAG \
            --set frontend.enabled=${{ github.event.inputs.deploy_frontend || 'true' }} \
            --set frontend.tag=$FRONTEND_TAG
