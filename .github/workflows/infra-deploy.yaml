name: "Terraform Multi-Env Deployment"

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action (plan, apply, or destroy)'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy

jobs:
  terraform:
    name: "Deploying Shared Infrastructure"
    runs-on: ubuntu-latest
    
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Step 1: Backend Storage check
      - name: Ensure Backend Storage Exists
        run: |
          az group create --name "tfstate-mgmt-rg" --location "eastus2"
          az storage account create --name "gymtfstatesharedunique" --resource-group "tfstate-mgmt-rg" --sku Standard_LRS
          az storage container create --name "tfstate" --account-name "gymtfstatesharedunique"
        continue-on-error: true

      # Step 2: Terraform Init (Dynamic Backend)
      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=tfstate-mgmt-rg" \
            -backend-config="storage_account_name=gymtfstatesharedunique" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=terraform.tfstate"
        working-directory: ./infrastructure

      # Step 3: Terraform Plan 
      - name: Terraform Plan
        run: |
          TAGS='{"project"="gym-management", "environment"="shared", "managed_by"="terraform"}'
          terraform plan \
            -var="env=shared" \
            -var="tags=$TAGS" \
            -var-file="envs/shared.tfvars" \
            -out=tfplan
        working-directory: ./infrastructure

      # Step 4: Terraform Apply 
      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        run: |
          TAGS='{"project"="gym-management", "environment"="shared", "managed_by"="terraform"}'
          terraform apply -var="tags=$TAGS" -auto-approve "tfplan"
        working-directory: ./infrastructure

      - name: Bootstrap Cluster (Install Cert-Manager)
        if: github.event.inputs.action == 'apply'
        run: |
          # 1. Get Cluster Credentials
          az aks get-credentials --resource-group "gym-app-shared-rg" --name "gym-shared-aks" --overwrite-existing
          
          # 2. Add Jetstack Helm repo
          helm repo add jetstack https://charts.jetstack.io
          helm repo update
          
          # 3. Install Cert-Manager with CRDs
          helm upgrade --install cert-manager jetstack/cert-manager \
            --namespace cert-manager \
            --create-namespace \
            --version v1.13.0 \
            --set installCRDs=true

      - name: Get ACR Name and Public IP
        if: github.event.inputs.action == 'apply'
        id: get_outputs
        run: |
          ACR_NAME=$(terraform output -raw acr_name)
          echo "acr_name=$ACR_NAME" >> $GITHUB_OUTPUT
          
          # Fetch the Public IP address of the App Gateway
          PUBLIC_IP=$(az network public-ip show --resource-group "tfstate-mgmt-rg" --name "gym-shared-appgw-pip" --query ipAddress -o tsv)
          echo "public_ip=$PUBLIC_IP" >> $GITHUB_OUTPUT
        working-directory: ./infrastructure

      - name: Update DuckDNS Domain
        if: github.event.inputs.action == 'apply' && success()
        run: |
          IP_ADDR=$(echo "${{ steps.get_outputs.outputs.public_ip }}" | tr -d '\r' | tr -d '\n' | xargs)
          TOKEN=$(echo "${{ secrets.DUCKDNS_TOKEN }}" | tr -d '\r' | tr -d '\n' | xargs)
          # Note: We might need a separate mechanism for domain management if they share an IP
          # For now, let's keep one shared base domain or handle it in the app deploy
          echo "Public IP is $IP_ADDR"

      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        run: |
          TAGS='{"project"="gym-management", "environment"="shared", "managed_by"="terraform"}'
          terraform destroy \
            -var="env=shared" \
            -var="tags=$TAGS" \
            -var-file="envs/shared.tfvars" \
            -auto-approve
        working-directory: ./infrastructure
